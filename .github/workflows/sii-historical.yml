name: SII historical falsification
on:
  push:
    branches: [main]
    paths:
      - 'sii/historical.py'
      - 'sii/historical_outcomes.py'
      - '.github/workflows/sii-historical.yml'
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Outcome validation start year'
        required: false
        default: '2019'
      end_year:
        description: 'Outcome validation end year'
        required: false
        default: '2024'
permissions:
  contents: write
jobs:
  falsify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run historical outcome falsification
        env:
          SII_JOB: historical
          SII_START_YEAR: ${{ inputs.start_year || '2019' }}
          SII_END_YEAR: ${{ inputs.end_year || '2024' }}
        run: python -m sii.runner
      - name: Run tests
        run: pytest -q
      - name: Publish historical report
        run: |
          mkdir -p reports
          cp artifacts/historical_outcome_report.json reports/latest-historical-outcome.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-historical-outcome.json
          git diff --cached --quiet || git commit -m "Publish latest historical outcome report [skip ci]"
          git push
      - name: Upload historical report
        uses: actions/upload-artifact@v4
        with:
          name: sii-historical-outcome-report
          path: artifacts/historical_outcome_report.json
          if-no-files-found: error

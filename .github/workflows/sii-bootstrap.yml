name: SII bootstrap data layer
on:
  push:
    branches: [main]
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bootstrap universe and free market-data connectivity
        env:
          SII_JOB: bootstrap
        run: python -m sii.bootstrap
      - name: Run unit tests
        run: pytest -q
      - name: Publish bootstrap report to repository
        run: |
          mkdir -p reports
          cp artifacts/bootstrap_report.json reports/latest-bootstrap.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-bootstrap.json
          git diff --cached --quiet || git commit -m "Publish latest bootstrap report [skip ci]"
          git push
      - name: Upload bootstrap report
        uses: actions/upload-artifact@v4
        with:
          name: sii-bootstrap-report
          path: artifacts/
          if-no-files-found: error

name: SII daily free refresh
on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: SII_JOB=daily python -m sii.runner

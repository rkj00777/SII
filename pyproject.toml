[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sii-v4-free-only"
version = "4.0.0"
description = "Free-only Stock Intelligence Engine for Indian listed equities"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

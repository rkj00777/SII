name: SII historical falsification
concurrency:
  group: sii-historical-falsification
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'sii/historical.py'
      - 'sii/historical_outcomes.py'
      - 'sii/pit_fundamental_backtest.py'
      - 'sii/financial_ingest.py'
      - 'sii/nse_browser.py'
      - 'sii/bse_financial.py'
      - 'sii/bse_browser.py'
      - 'sii/bse_universe.py'
      - 'sii/six_module_empirical_validation.py'
      - 'sii/bse_pit_validation.py'
      - 'sii/adapters.py'
      - '.github/workflows/sii-historical.yml'
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Outcome validation start year'
        required: false
        default: '2019'
      end_year:
        description: 'Outcome validation end year'
        required: false
        default: '2023'
permissions:
  contents: write
jobs:
  falsify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: artifacts/pit_cache_v3
          key: sii-pit-cache-v3-${{ github.ref_name }}
          restore-keys: |
            sii-pit-cache-v3-
      - name: Run historical outcome falsification
        env:
          SII_JOB: historical
          SII_START_YEAR: ${{ inputs.start_year || '2019' }}
          SII_END_YEAR: ${{ inputs.end_year || '2024' }}
        run: python -m sii.runner
      - name: Run BSE true-PIT fundamental validation fallback
        env:
          SII_BSE_PIT_MAX_SYMBOLS: 100
          SII_BSE_PIT_WORKERS: 8
        run: python -m sii.bse_pit_validation
      - name: Run empirical six-module validation
        run: python -m sii.six_module_empirical_validation
      - name: Run tests
        run: pytest -q
      - name: Publish historical report
        run: |
          mkdir -p reports
          cp artifacts/historical_outcome_report.json reports/latest-historical-outcome.json
          cp artifacts/pit_fundamental_backtest.json reports/latest-pit-fundamental-backtest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp artifacts/historical_outcome_report.json reports/latest-historical-outcome.json
            cp artifacts/pit_fundamental_backtest.json reports/latest-pit-fundamental-backtest.json
            cp artifacts/six_module_empirical_validation.json reports/latest-six-module-empirical-validation.json
            cp artifacts/bse_pit_fundamental_validation.json reports/latest-bse-pit-fundamental-validation.json
            python -m sii.production_gate || true
            cp artifacts/production_gate_report.json reports/latest-production-gate.json
            git add reports/latest-historical-outcome.json reports/latest-pit-fundamental-backtest.json reports/latest-bse-pit-fundamental-validation.json reports/latest-six-module-empirical-validation.json reports/latest-production-gate.json
            git diff --cached --quiet || git commit -m "Publish latest SII validation reports [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Upload historical report
        uses: actions/upload-artifact@v4
        with:
          name: sii-historical-outcome-report
          path: artifacts/*report.json
          if-no-files-found: error

